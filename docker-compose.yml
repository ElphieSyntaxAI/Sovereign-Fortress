# Redis only — for full local stack use: npm run docker:dev
# See docs/DOCKER_LOCAL_DEV.md
services:
  redis:
    image: redis:alpine
    container_name: msgf-redis
    ports:
      - "6379:6379"
    volumes:
      - msgf_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  msgf_redis_data:
