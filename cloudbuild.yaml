# cloudbuild.yaml — MSGF Core: build image → Artifact Registry → Cloud Run
#
# Submit manually:
#   gcloud builds submit --config=cloudbuild.yaml --project=YOUR_PROJECT_ID .
#
# Or connect this repo to a Cloud Build trigger (push to main / tags).
#
# -----------------------------------------------------------------------------
# Prerequisites
# -----------------------------------------------------------------------------
# 1) APIs: Cloud Build, Cloud Run, Artifact Registry, Secret Manager, Serverless VPC Access, Compute
#
# 2) Artifact Registry (Docker), e.g.:
#    gcloud artifacts repositories create ${_AR_REPOSITORY} \
#      --repository-format=docker --location=${_REGION} --project=${PROJECT_ID}
#
# 3) Serverless VPC Access connector (same region as Cloud Run), e.g.:
#      ./setup-cloud.sh   # creates msgf-connector on network default (10.8.0.0/28) when missing
#    Or manually:
#      gcloud compute networks vpc-access connectors create ${_VPC_CONNECTOR} \
#        --project=${PROJECT_ID} --region=${_REGION} --network=${_VPC_NETWORK} --range=${_VPC_CONNECTOR_RANGE}
#
# 4) Secrets (create once; names must match _SECRET_* substitutions or change them):
#    printf '%s' "sk-..." | gcloud secrets create msgf-openai-api-key --data-file=-
#    printf '%s' "sk_live_..." | gcloud secrets create msgf-stripe-secret-key --data-file=-
#    printf '%s' "whsec_..." | gcloud secrets create msgf-stripe-webhook-secret --data-file=-
#
# 5) Cloud Build service account (default: PROJECT_NUMBER@cloudbuild.gserviceaccount.com)
#    needs at least:
#    - roles/artifactregistry.writer (push images)
#    - roles/run.admin (deploy Cloud Run)
#    - roles/iam.serviceAccountUser on the Cloud Run *runtime* service account
#    - roles/secretmanager.secretAccessor on EACH secret referenced in --set-secrets
#      (required so deploy can attach secrets to the service)
#    - roles/vpcaccess.user on the Cloud Run runtime service account
#      (default: PROJECT_NUMBER-compute@developer.gserviceaccount.com when using --vpc-connector)
#
# 6) Non-secret config (Supabase URL, etc.): add flags to the deploy step, e.g.
#    --set-env-vars=FOO=bar  (never put API keys there)
#    MSGF also supports ANTHROPIC_API_KEY for narrative flows — add another Secret + entry
#    to --set-secrets if you use Anthropic in production.
#
# Cloud Run contract: https://cloud.google.com/run/docs/container-contract
#
substitutions:
  _REGION: us-central1
  _AR_REPOSITORY: msgf
  _IMAGE_NAME: msgf-core
  _SERVICE_NAME: msgf-core
  # Requests per instance. Raise for I/O-heavy MSGF traffic (max 1000). Tune with load tests.
  _CLOUD_RUN_CONCURRENCY: "160"
  _CLOUD_RUN_MIN_INSTANCES: "0"
  # Within default regional Serverless CPU allocation at 2 vCPU/instance (override after quota increase).
  _CLOUD_RUN_MAX_INSTANCES: "28"
  _CLOUD_RUN_CPU: "2"
  _CLOUD_RUN_MEMORY: "2Gi"
  # Secret Manager *resource* names (short id in same project). Values are injected at runtime only.
  _SECRET_OPENAI: msgf-openai-api-key
  _SECRET_STRIPE_SECRET: msgf-stripe-secret-key
  _SECRET_STRIPE_WEBHOOK: msgf-stripe-webhook-secret
  _VPC_NETWORK: default
  _VPC_CONNECTOR: msgf-connector
  _VPC_CONNECTOR_RANGE: 10.8.0.0/28
  _VPC_EGRESS: private-ranges-only

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s

steps:
  - id: build-msgf-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:latest"
      - --build-arg
      - GIT_REVISION=${COMMIT_SHA}
      - --build-arg
      - APP_IMAGE_VERSION=${SHORT_SHA}
      - .

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --platform=managed
      - >-
        --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}
      - --port=8080
      - --cpu=${_CLOUD_RUN_CPU}
      - --memory=${_CLOUD_RUN_MEMORY}
      - --concurrency=${_CLOUD_RUN_CONCURRENCY}
      - --min-instances=${_CLOUD_RUN_MIN_INSTANCES}
      - --max-instances=${_CLOUD_RUN_MAX_INSTANCES}
      # Keeps CPU available for concurrent in-flight work (billed accordingly).
      - --no-cpu-throttling
      # Private DB / Redis: RFC1918 egress via Serverless VPC Access (create connector before deploy).
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=${_VPC_EGRESS}
      # Runtime secrets only — values never appear in this file or in plain env vars in the console.
      - >-
        --set-secrets=OPENAI_API_KEY=${_SECRET_OPENAI}:latest,STRIPE_SECRET_KEY=${_SECRET_STRIPE_SECRET}:latest,STRIPE_WEBHOOK_SECRET=${_SECRET_STRIPE_WEBHOOK}:latest

# Pushes both tags to Artifact Registry after a successful build.
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:latest"
