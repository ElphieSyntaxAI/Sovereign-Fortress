services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: author-ecosystem-server
    environment:
      PORT: 3002
      # Supabase Postgres (direct). Legacy Docker `db` + `schema.sql` were removed.
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: change_me_dev
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-text-embedding-004}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.0-flash}
      RAG_TOP_K: ${RAG_TOP_K:-8}
    ports:
      - "3002:3002"

