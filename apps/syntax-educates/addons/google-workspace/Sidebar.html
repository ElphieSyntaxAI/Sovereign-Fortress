<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <style>
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13px;
        margin: 0;
        padding: 12px;
        color: #1f2937;
      }
      h1 { font-size: 14px; margin: 0 0 8px; }
      h2 { font-size: 12px; margin: 12px 0 4px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.04em; }
      .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
      .stat { display: inline-block; padding: 2px 6px; border-radius: 4px; background: #eef2ff; color: #3730a3; }
      .stat.warn { background: #fef3c7; color: #92400e; }
      .stat.ok { background: #dcfce7; color: #166534; }
      button { padding: 6px 10px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 4px; background: #fff; cursor: pointer; }
      button.primary { background: #4f46e5; color: white; border-color: #4f46e5; }
      iframe { width: 100%; height: 280px; border: 1px solid #e5e7eb; border-radius: 4px; }
      input[type="url"], input[type="text"] {
        width: 100%;
        padding: 4px 6px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        font-size: 12px;
      }
      textarea { width: 100%; height: 60px; padding: 4px 6px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; }
      .footer { margin-top: 8px; font-size: 11px; color: #6b7280; }
    </style>
  </head>
  <body>
    <h1>Syntax Educates</h1>
    <div class="row">
      <span class="stat" id="focusStat">focused</span>
      <span class="stat" id="ecosystemStat">GOOGLE_EDIT</span>
      <span class="stat ok" id="halStat">HAL Lite</span>
    </div>

    <h2>Active session</h2>
    <div class="row">
      <span>Active time:</span>
      <span class="stat ok" id="activeTime">0s</span>
    </div>
    <div class="row">
      <span>Effort:</span>
      <span class="stat ok" id="confidenceStat">—</span>
    </div>
    <div class="row" id="pasteWarnRow" style="display:none">
      <span class="stat warn" id="pasteWarn">PASTE_INJECTION</span>
    </div>

    <h2>Document check</h2>
    <div class="row">
      <button id="syncDocBtn" type="button">Sync doc length (HAL Lite)</button>
      <button id="milestoneBtn" type="button">Check milestones</button>
      <button id="submitBtn" type="button">Turn in (lock)</button>
    </div>
    <div class="footer" id="halResult">HAL Lite idle.</div>

    <h2>Embedded Research Portal</h2>
    <div class="row">
      <input id="searchUrl" type="url" placeholder="https://scholar.google.com/scholar?q=..." />
    </div>
    <div class="row">
      <button id="openSearch">Open</button>
      <button id="anchorBtn" class="primary">Generate Citation Anchor</button>
    </div>
    <iframe id="researchFrame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms" referrerpolicy="no-referrer"></iframe>

    <h2>Captured snippet</h2>
    <textarea id="snippetText" placeholder="Paste the snippet you copied from the source..."></textarea>
    <div class="footer" id="lastResult">No citation check run yet.</div>

    <script>
      // ---- focus monitor ----
      var focused = !document.hidden;
      var lastChangeAt = Date.now();
      var activeMs = 0;
      var pendingFocus = [];

      function recordFocus(nextFocused, reason) {
        var now = Date.now();
        if (focused && !nextFocused) activeMs += now - lastChangeAt;
        focused = nextFocused;
        lastChangeAt = now;
        pendingFocus.push({
          ts: now,
          type: nextFocused ? "focus_resume" : "focus_pause",
          surface: "google-docs",
          reason: reason || (nextFocused ? "tab_focus" : "tab_hidden"),
        });
        document.getElementById("focusStat").textContent = nextFocused ? "focused" : "paused";
        document.getElementById("focusStat").className = "stat " + (nextFocused ? "ok" : "warn");
        flushFocus();
      }

      document.addEventListener("visibilitychange", function () {
        recordFocus(!document.hidden, document.hidden ? "tab_hidden" : "tab_focus");
      });
      window.addEventListener("blur", function () { recordFocus(false, "window_blur"); });
      window.addEventListener("focus", function () { recordFocus(true, "window_focus"); });

      function flushFocus() {
        if (pendingFocus.length === 0) return;
        var beats = pendingFocus.splice(0, pendingFocus.length);
        google.script.run
          .withFailureHandler(function () { /* fail-open */ })
          .pushFocusEvents({ focusEvents: beats });
      }

      // ---- active-time ticker ----
      setInterval(function () {
        var now = Date.now();
        if (focused) activeMs += now - lastChangeAt;
        lastChangeAt = now;
        var s = Math.floor(activeMs / 1000);
        var label = s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60) + "s";
        document.getElementById("activeTime").textContent = label;
      }, 1000);

      // ---- research portal ----
      var recentSnippets = [];
      var portalUrl = "";
      var readingStartedAt = 0;

      document.getElementById("openSearch").addEventListener("click", function () {
        portalUrl = document.getElementById("searchUrl").value.trim();
        if (!portalUrl) return;
        document.getElementById("researchFrame").src = portalUrl;
        readingStartedAt = Date.now();
      });

      document.getElementById("anchorBtn").addEventListener("click", function () {
        var text = document.getElementById("snippetText").value.trim();
        if (!text) return;
        recentSnippets.push({
          snippetId: cryptoRandomId(),
          sourceUrl: portalUrl || "about:blank",
          text: text,
          readingTimeMs: readingStartedAt ? Date.now() - readingStartedAt : 0,
          capturedAt: Date.now(),
          hasCitationAnchor: true,
        });
        document.getElementById("lastResult").textContent = "Anchor minted for snippet. Paste into your document.";
      });

      // ---- citation check ----
      // Listen for paste events inside the sidebar — the host doc's paste cannot be observed
      // directly from a sidebar, so a "Check last paste" button is provided as a fallback.
      var pasteButton = document.createElement("button");
      pasteButton.textContent = "Check pasted text";
      pasteButton.addEventListener("click", function () {
        var pasted = document.getElementById("snippetText").value.trim();
        if (!pasted) return;
        google.script.run
          .withSuccessHandler(function (res) {
            document.getElementById("lastResult").textContent =
              "Citation: " + (res && res.classification ? res.classification : JSON.stringify(res));
          })
          .withFailureHandler(function (err) {
            document.getElementById("lastResult").textContent = "Check failed: " + err;
          })
          .checkCitation({
            pastedText: pasted,
            recentSnippets: recentSnippets,
          });
      });
      document.body.appendChild(pasteButton);

      // ---- HAL Lite (document length deltas + milestone / turn-in) ----
      var lastDocChars = null;
      var PASTE_THRESHOLD = 120;

      function showHalResult(msg, warn) {
        document.getElementById("halResult").textContent = msg;
        document.getElementById("pasteWarnRow").style.display = warn ? "flex" : "none";
      }

      document.getElementById("syncDocBtn").addEventListener("click", function () {
        google.script.run
          .withSuccessHandler(function (res) {
            if (!res || res.ok === false) {
              showHalResult("HAL Lite sync failed: " + ((res && res.error) || "unknown"), true);
              return;
            }
            var chars = typeof res.docChars === "number" ? res.docChars : 0;
            var delta = lastDocChars == null ? 0 : chars - lastDocChars;
            lastDocChars = chars;
            if (delta > PASTE_THRESHOLD) {
              showHalResult("PASTE_INJECTION flagged (+" + delta + " chars). Confidence updated.", true);
            } else {
              showHalResult("Synced doc length " + chars + " (Δ " + delta + ").", false);
            }
            if (res.confidence != null) {
              document.getElementById("confidenceStat").textContent =
                Math.round(Number(res.confidence) * 100) + "%";
            }
          })
          .withFailureHandler(function (err) {
            showHalResult("HAL Lite error: " + err, true);
          })
          .pushHalLiteDelta({});
      });

      document.getElementById("milestoneBtn").addEventListener("click", function () {
        google.script.run
          .withSuccessHandler(function (res) {
            if (!res || res.ok === false) {
              showHalResult("Milestone check failed: " + ((res && res.error) || "unknown"), true);
              return;
            }
            var incomplete = (res.check && res.check.incompleteSteps) || [];
            var label =
              incomplete.length === 0
                ? "Milestones complete — Socratic unlocked."
                : "Still need: " + incomplete.map(function (s) { return s.label; }).join(", ");
            showHalResult(label, incomplete.length > 0);
          })
          .withFailureHandler(function (err) {
            showHalResult("Milestone error: " + err, true);
          })
          .runMilestoneCheck({});
      });

      document.getElementById("submitBtn").addEventListener("click", function () {
        if (!window.confirm("Turn in this assignment? Your document will become read-only.")) return;
        google.script.run
          .withSuccessHandler(function (res) {
            if (!res || res.ok === false) {
              showHalResult("Submit failed: " + ((res && res.error) || "unknown"), true);
              return;
            }
            showHalResult("Turn-In Lockout active — document is read-only.", false);
          })
          .withFailureHandler(function (err) {
            showHalResult("Submit error: " + err, true);
          })
          .submitTurnIn({});
      });

      function cryptoRandomId() {
        if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
        return "s_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      }
    </script>
  </body>
</html>
