name: MSGF Tier Heartbeat

on:
  schedule:
    # Every 6 hours for YELLOW cadence; GREEN and purge run in same worker.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  tier-processor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # Ensures migrations are applied before worker jobs read schema.
      - name: Apply Supabase migrations
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' && secrets.SUPABASE_DB_PASSWORD != '' }}
        run: |
          npx supabase --version
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Legacy JS worker (YELLOW/GREEN beats). Prefer v32-heartbeat API in production.
      - name: Run MSGF Tier Processor (legacy)
        run: node packages/msgf/scripts/msgf-tier-processor.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run V3.2 ops heartbeat (tier batches + Hall 30d cold + Redis purge)
        if: ${{ secrets.MSGF_OPS_CRON_SECRET != '' && vars.MSGF_APP_URL != '' }}
        run: |
          curl -sfS -X POST "${MSGF_APP_URL%/}/api/msgf/ops/v32-heartbeat" \
            -H "Authorization: Bearer ${MSGF_OPS_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"hall_purge_days":30}'
        env:
          MSGF_APP_URL: ${{ vars.MSGF_APP_URL }}
          MSGF_OPS_CRON_SECRET: ${{ secrets.MSGF_OPS_CRON_SECRET }}

